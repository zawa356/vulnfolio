name: M0 live source smoke (manual)

# This explicitly runs against CIRCL's public service. Do not schedule it.
# One known ID, one upstream GET, no mirroring or automatic retry on 429.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VULNFOLIO_DB: ${{ runner.temp }}/vulnfolio-live-smoke.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e .
      - name: Fetch one known CVE from the live source
        run: |
          python -m vulnfolio.vulnerability_sync --id CVE-2024-3094
      - name: Start local dashboard and verify real CVE by HTTP
        run: |
          uvicorn vulnfolio.vulnerability_api:app --host 127.0.0.1 --port 8765 --log-level warning &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import httpx
          endpoint = "http://127.0.0.1:8765"
          deadline = time.monotonic() + 12
          with httpx.Client(timeout=3) as client:
              while time.monotonic() < deadline:
                  try:
                      health = client.get(endpoint + "/api/v1/health")
                      if health.status_code == 200:
                          break
                  except httpx.RequestError:
                      pass
                  time.sleep(0.2)
              else:
                  raise RuntimeError("Uvicorn not ready")
              assert health.json()["vulnerability_count"] == 1
              detail = client.get(endpoint + "/api/v1/vulnerabilities/CVE-2024-3094")
              assert detail.status_code == 200, detail.text[:200]
              record = detail.json()
              assert record["id"] == "CVE-2024-3094"
              assert record["provider"] == "vulnerability-lookup"
              assert record["description"]
              page = client.get(endpoint + "/")
              assert page.status_code == 200
              assert "@tabler/core@1.7.5" in page.text
              print("LIVE M0 PASS: upstream CVE -> SQLite -> local REST -> Tabler HTML")
          PY
