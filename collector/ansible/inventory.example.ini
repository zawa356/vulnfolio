# EXAMPLE ONLY. Replace addresses/users via your PRIVATE inventory or vault.
# Never commit actual inventory passwords, hosts, keys or domain information.
#
# Collector only targets these two explicit groups.
# Ansible controller recommended: Linux/WSL. Windows commonly uses WinRM HTTPS.
#
# Authentication is intentionally NOT included; use SSH agent and Ansible Vault.

[vulnfolio_linux]
linux-test ansible_host=192.0.2.10 ansible_user=inventory

[vulnfolio_windows]
windows-test ansible_host=192.0.2.20 ansible_user=inventory

[vulnfolio_windows:vars]
ansible_connection=winrm
ansible_port=5986
ansible_winrm_scheme=https
ansible_winrm_server_cert_validation=validate
